[package]
name = "spikeq"
version = "1.0.2"
edition = "2021"
authors = ["Nicholas D. Crosbie"]
license = "MIT"
description = "A synthetic FASTQ record generator with pattern spiking"
homepage = "https://github.com/Rbfinch/spikeq"
documentation = "https://github.com/Rbfinch/spikeq"
repository = "https://github.com/Rbfinch/spikeq"
readme = "README.md"
categories = ["science"]
keywords = ["bioinformatics", "FASTQ", "JSON", "regex", "spike"]

[dependencies]
seq_io = "0.3.4"
regex = "1.11.1"
clap = { version = "4.5.37", features = ["derive", "cargo", "wrap_help"] }
jsonschema = "0.30.0"
serde_json = "1.0.140"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
uuid = { version = "1.16.0", features = ["v4"] }
colored = "3.0.0"
once_cell = "1.21.3"
thiserror = "1.0.58"
miette = { version = "7.1.0", features = ["fancy"] }

[build-dependencies]
clap = { version = "4.5.37", features = ["derive", "cargo"] }
clap_complete = "4.5.1"
clap_mangen = "0.2.19"

[profile.release]
lto = true
